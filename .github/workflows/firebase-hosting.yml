name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Deployment destination (client-review keeps the live site unchanged)'
        type: choice
        required: true
        default: client-review
        options:
          - client-review
          - live

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_VITASPACE_API_URL: ${{ secrets.PUBLIC_VITASPACE_API_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OFFICEHIVE }}
          projectId: officehive
          channelId: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'live' }}
          expires: 30d
